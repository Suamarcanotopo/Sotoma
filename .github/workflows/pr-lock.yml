name: SOTOMA PR Lock

on:
  pull_request:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-lock-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the two scoped contract files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, urllib.parse, urllib.request
          repo = os.environ["GH_REPO"]
          sha = os.environ["GH_SHA"]
          token = os.environ["GH_TOKEN"]
          for name in ["docs/pr-lock/REGISTRY.json", "scripts/pr_lock_check.py"]:
              url = "https://api.github.com/repos/" + repo + "/contents/" + urllib.parse.quote(name) + "?ref=" + urllib.parse.quote(sha)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode("utf-8"))
              out = pathlib.Path(name)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(base64.b64decode(data["content"]))
          PY
      - name: Validate PR metadata and versioned ledger
        run: python3 scripts/pr_lock_check.py
